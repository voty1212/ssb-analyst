services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssb_analyst
      POSTGRES_USER: ssb_analyst
      POSTGRES_PASSWORD: ssb_analyst
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssb_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ssb_analyst
      SPRING_DATASOURCE_USERNAME: ssb_analyst
      SPRING_DATASOURCE_PASSWORD: ssb_analyst
    ports:
      - "8080:8080"

volumes:
  db-data:
